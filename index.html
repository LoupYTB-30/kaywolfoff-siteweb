<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support NoxStudio — Tickets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:20px}
h1{text-align:center;font-size:22px;margin-bottom:8px;color:#fff}
.subtitle{text-align:center;font-size:14px;color:#8b949e;margin-bottom:24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #30363d;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;font-size:14px;cursor:pointer;border:none;background:none;color:#8b949e;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.tab:hover:not(.active){color:#e6edf3}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;background:#da3633;color:#fff;margin-left:5px}
input,select,textarea{font-family:Arial,sans-serif;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:8px 12px;width:100%;font-size:14px;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#58a6ff}
textarea{resize:vertical;min-height:80px}
label{font-size:13px;color:#8b949e;display:block;margin-bottom:4px}
.hint{font-size:12px;color:#8b949e;margin-top:-6px;margin-bottom:10px;line-height:1.5}
.btn{padding:9px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #30363d;background:#21262d;color:#e6edf3}
.btn:hover{background:#30363d}
.btn.primary{background:#238636;border-color:#2ea043;color:#fff}
.btn.primary:hover{background:#2ea043}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.danger{border-color:#da3633;color:#f85149;background:none}
.btn.danger:hover{background:#3d1c1c}
.ticket-list{display:flex;flex-direction:column;gap:8px}
.ticket{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;cursor:pointer}
.ticket:hover,.ticket.selected{border-color:#58a6ff}
.ticket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ticket-id{font-size:11px;color:#8b949e;font-family:monospace}
.ticket-title{font-size:14px;font-weight:600;margin-bottom:4px}
.ticket-meta{font-size:12px;color:#8b949e}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.open{background:#0d419d;color:#58a6ff}
.in_progress{background:#5a3e1b;color:#d29922}
.closed{background:#0f2d1a;color:#3fb950}
.prio-high{background:#490202;color:#f85149}
.prio-med{background:#5a3e1b;color:#d29922}
.prio-low{background:#21262d;color:#8b949e}
.assigned{background:#2d1b69;color:#a78bfa;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px}
.detail-title{font-size:16px;font-weight:600;margin-bottom:8px}
.detail-body{font-size:14px;color:#8b949e;line-height:1.6;margin:12px 0;white-space:pre-wrap}
.section-title{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border:1px solid #30363d;border-radius:20px;font-size:12px;cursor:pointer;background:#161b22;color:#8b949e}
.filter-btn.active{background:#0d2d6b;border-color:#58a6ff;color:#58a6ff}
.empty{text-align:center;padding:30px;color:#8b949e;font-size:14px}
.notif{border-radius:6px;padding:10px 14px;font-size:13px;display:none;margin-bottom:12px}
.notif.show{display:block}
.notif.success{background:#0f2d1a;border:1px solid #238636;color:#3fb950}
.error{color:#f85149;font-size:13px;display:none;margin-top:4px}
.loading{text-align:center;padding:20px;color:#8b949e;font-size:13px}
.admin-bar{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px}
.admin-badge{background:#5a3e1b;color:#d29922;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
.reply-box{background:#0d2d6b22;border:1px solid #1f3a6e;border-radius:8px;padding:12px;margin-top:12px}
.reply-box .reply-label{font-size:11px;color:#58a6ff;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.reply-box .reply-text{font-size:14px;color:#e6edf3;line-height:1.6;white-space:pre-wrap}
.reply-input-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:12px}
.reply-input-box label{font-size:12px;color:#58a6ff;font-weight:600;margin-bottom:6px}
.search-box{display:flex;gap:8px;margin-bottom:16px;max-width:400px}
.search-box input{margin:0}
.guide-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.8;color:#8b949e}
.guide-box strong{color:#e6edf3}
.lang-btn{position:fixed;top:16px;right:16px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#e6edf3;z-index:999}
.lang-btn:hover{background:#21262d}
@media(max-width:600px){.layout{grid-template-columns:1fr}}
.log-entry{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.log-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.log-content{flex:1}
.log-action{font-size:13px;font-weight:600;color:#e6edf3;margin-bottom:2px}
.log-meta{font-size:11px;color:#8b949e}
.log-detail{font-size:12px;color:#8b949e;margin-top:4px;font-style:italic}
</style>
</head>
<body>
<button class="lang-btn" id="lang-toggle" onclick="toggleLang()">🇬🇧 English</button>
<h1>🎫 Support NoxStudio</h1>
<p class="subtitle" data-i18n="subtitle"></p>

<div class="tabs">
  <button class="tab active" onclick="switchTab('tickets')"><span data-i18n="tab_tickets"></span> <span class="badge" id="open-count">0</span></button>
  <button class="tab" onclick="switchTab('new')" data-i18n="tab_new"></button>
  <button class="tab" onclick="switchTab('suivre')" data-i18n="tab_follow"></button>
  <button class="tab" onclick="switchTab('admin')" data-i18n="tab_admin"></button>
</div>

<div id="tab-tickets">
  <div class="notif success" id="notif-created"></div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)" data-i18n="f_all"></button>
    <button class="filter-btn" onclick="setFilter('open',this)" data-i18n="f_open"></button>
    <button class="filter-btn" onclick="setFilter('in_progress',this)" data-i18n="f_progress"></button>
    <button class="filter-btn" onclick="setFilter('closed',this)" data-i18n="f_closed"></button>
  </div>
  <div class="layout">
    <div>
      <div class="section-title" data-i18n="list"></div>
      <div class="ticket-list" id="ticket-list"><div class="loading" data-i18n="loading"></div></div>
    </div>
    <div>
      <div class="section-title" data-i18n="detail"></div>
      <div id="ticket-detail"><div class="empty" data-i18n="select_ticket"></div></div>
    </div>
  </div>
</div>

<div id="tab-new" style="display:none">
  <div style="max-width:500px">
    <div class="guide-box" data-i18n="guide"></div>
    <label data-i18n="lbl_tag"></label>
    <input type="text" id="t-discord" data-i18n-ph="ph_tag">
    <label data-i18n="lbl_id"></label>
    <input type="text" id="t-discordid" data-i18n-ph="ph_id">
    <div class="hint" data-i18n="hint_id"></div>
    <label data-i18n="lbl_cat"></label>
    <select id="t-cat">
      <option value="Support général" data-i18n="cat1"></option>
      <option value="Bug / Problème" data-i18n="cat2"></option>
      <option value="Demande de partenariat" data-i18n="cat3"></option>
      <option value="Sanction / Appel" data-i18n="cat4"></option>
      <option value="Autre" data-i18n="cat5"></option>
    </select>
    <label data-i18n="lbl_subject"></label>
    <input type="text" id="t-subject" maxlength="150" data-i18n-ph="ph_subject">
    <label data-i18n="lbl_prio"></label>
    <select id="t-prio">
      <option value="Faible" data-i18n="prio_low"></option>
      <option value="Moyenne" data-i18n="prio_med" selected></option>
      <option value="Haute" data-i18n="prio_high"></option>
    </select>
    <label data-i18n="lbl_msg"></label>
    <textarea id="t-msg" maxlength="1500" data-i18n-ph="ph_msg"></textarea>
    <button class="btn primary" onclick="createTicket()" data-i18n="send"></button>
    <div class="error" id="form-error" data-i18n="form_error"></div>
  </div>
</div>

<div id="tab-suivre" style="display:none">
  <div style="max-width:500px">
    <p style="font-size:14px;color:#8b949e;margin-bottom:14px" data-i18n="follow_hint"></p>
    <div class="search-box">
      <input type="text" id="search-id" data-i18n-ph="ph_search">
      <button class="btn primary" onclick="searchTicket()" data-i18n="search_btn"></button>
    </div>
    <div id="search-result"></div>
  </div>
</div>

<div id="tab-admin" style="display:none">
  <div id="admin-login" style="max-width:300px">
    <label data-i18n="lbl_staff"></label>
    <input type="text" id="admin-name" data-i18n-ph="ph_staff">
    <label data-i18n="lbl_pwd"></label>
    <input type="password" id="admin-pwd" data-i18n-ph="ph_pwd">
    <button class="btn primary" onclick="checkAdmin()" data-i18n="login"></button>
    <div class="error" id="pwd-error" data-i18n="pwd_error"></div>
  </div>
  <div id="admin-panel" style="display:none">
    <div class="admin-bar">
      <span>🛡️</span>
      <span data-i18n="admin_on"></span>
      <span id="admin-name-display" style="color:#a78bfa;font-weight:600"></span>
      <span class="admin-badge" data-i18n="staff_badge"></span>
      <button class="btn sm danger" style="margin-left:auto" onclick="logoutAdmin()" data-i18n="logout"></button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn sm" onclick="switchAdminTab('tickets')" id="atab-tickets" style="background:#238636;border-color:#2ea043;color:#fff" data-i18n="atab_tickets"></button>
      <button class="btn sm" onclick="switchAdminTab('logs')" id="atab-logs" data-i18n="atab_logs"></button>
    </div>

    <div id="admin-tickets-section">
      <div class="filters">
        <button class="filter-btn active" onclick="setAdminFilter('all',this)" data-i18n="f_all"></button>
        <button class="filter-btn" onclick="setAdminFilter('open',this)" data-i18n="f_open"></button>
        <button class="filter-btn" onclick="setAdminFilter('in_progress',this)" data-i18n="f_progress"></button>
        <button class="filter-btn" onclick="setAdminFilter('closed',this)" data-i18n="f_closed"></button>
      </div>
      <div class="layout">
        <div>
          <div class="section-title" data-i18n="list"></div>
          <div class="ticket-list" id="admin-ticket-list"></div>
        </div>
        <div>
          <div class="section-title" data-i18n="manage"></div>
          <div id="admin-ticket-detail"><div class="empty" data-i18n="select_ticket"></div></div>
        </div>
      </div>
    </div>

    <div id="admin-logs-section" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="section-title" data-i18n="history"></div>
        <button class="btn sm" onclick="loadLogs()" data-i18n="refresh"></button>
      </div>
      <div id="logs-list"><div class="loading" data-i18n="loading"></div></div>
    </div>
  </div>
</div>

const GS="https://script.google.com/macros/s/AKfycbwgWT8lfraeGVgWDu5q2aDMQKauXQ3jhOpOaLtQEIw3-Q7_n-v2X8NbTT9PHldJ9v3-/exec";
const ADMIN_PASSWORD="NoxStudio";

let tickets=[],filter="all",adminFilter="all",selectedId=null,adminSelectedId=null,isAdmin=false,adminPseudo="";
let lang="fr";
try{ if(localStorage.getItem("lang")==="en") lang="en"; }catch(e){}

// ====== TRADUCTIONS ======
const TR={
fr:{
  subtitle:"Système de tickets — envoie ta demande, on te répond sur Discord",
  tab_tickets:"Tickets",tab_new:"+ Nouveau ticket",tab_follow:"🔍 Suivre mon ticket",tab_admin:"🔒 Admin",

  hint_id:"⚠️ Requis pour recevoir une vraie notification Discord",
  lbl_cat:"Catégorie",cat1:"Support général",cat2:"Bug / Problème",cat3:"Demande de partenariat",cat4:"Sanction / Appel",cat5:"Autre",

  confirm_delete:"Supprimer ce ticket ?",
  status_open:"Ouvert",status_in_progress:"En cours",status_closed:"Fermé",

},

  lbl_tag:"Discord tag (username)",ph_tag:"e.g. NoxStudio",lbl_id:"Discord ID",ph_id:"e.g. 123456789012345678",
  hint_id:"⚠️ Required to receive a real Discord notification",
  lbl_cat:"Category",cat1:"General support",cat2:"Bug / Issue",cat3:"Partnership request",cat4:"Sanction / Appeal",cat5:"Other",
  lbl_subject:"Subject",ph_subject:"Summarize your problem",lbl_prio:"Priority",prio_low:"Low",prio_med:"Medium",prio_high:"High",

  lbl_staff:"Your username (staff)",ph_staff:"e.g. NoxStudio",lbl_pwd:"Admin password",ph_pwd:"Password...",
  login:"🔓 Log in",pwd_error:"Wrong password or missing username.",
  admin_on:"Admin mode enabled —",staff_badge:"STAFF",logout:"Log out",
  atab_tickets:"🎫 Tickets",atab_logs:"📋 Logs",
  lbl_assignee:"👤 Assigned to",ph_assignee:"Username of the staff member handling it",lbl_status:"🔄 Status",
  opt_open:"🔵 Open",opt_progress:"🟡 In progress",opt_closed:"🟢 Closed",
  lbl_reply:"✏️ Reply",ph_reply:"Write your reply here...",save:"💾 Save + Notify",del:"🗑 Delete",

  status_open:"Open",status_in_progress:"In progress",status_closed:"Closed",
  waiting:"Waiting for the team's reply...",reply_current:"💬 Current reply",reply_team:"💬 Team reply",

  created:"✅ Ticket created! Your ID: <strong>{id}</strong> — write it down to track your request in the 🔍 tab",
  btn_lang:"🇫🇷 Français"
}};
function tr(k){ return (TR[lang]&&TR[lang][k]) || TR.fr[k] || k; }

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML=tr(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=tr(el.getAttribute("data-i18n-ph")); });
  document.getElementById("lang-toggle").textContent=tr("btn_lang");
  renderList();
  if(isAdmin) renderAdminList();
  if(selectedId&&tickets.find(x=>x.id===selectedId)) selectTicket(selectedId);
  else document.getElementById("ticket-detail").innerHTML='<div class="empty">'+tr("select_ticket")+'</div>';
  if(isAdmin&&adminSelectedId&&tickets.find(x=>x.id===adminSelectedId)) selectAdminTicket(adminSelectedId);
  else if(isAdmin) document.getElementById("admin-ticket-detail").innerHTML='<div class="empty">'+tr("select_ticket")+'</div>';
  const sr=document.getElementById("search-result");
  if(sr.innerHTML&&document.getElementById("search-id").value.trim()) searchTicket();
}
function toggleLang(){
  lang=lang==="fr"?"en":"fr";
  try{ localStorage.setItem("lang",lang); }catch(e){}
  applyLang();
}

// ====== OUTILS ======
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cut(s,n){ s=String(s==null?"":s); return s.length>n?s.slice(0,n-1)+"…":s; }
function formatDate(d){
  if(!d) return "";
  const dt=new Date(d);
  if(isNaN(dt)) return String(d);
  return dt.toLocaleString(lang==="fr"?"fr-FR":"en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function nowStr(){
  return new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
// Appel au Google Apps Script (écritures)
function gs(params){
  const qs=Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k]==null?"":params[k])).join("&");
  return fetch(GS+"?"+qs,{mode:"no-cors"}).catch(e=>console.error("GS error",e));
}
function statusLabel(s){ return tr("status_"+s); }
function statusIcon(s){return{open:"🔵",in_progress:"🟡",closed:"🟢"}[s]||""}
function prioClass(p){return{Haute:"prio-high",Moyenne:"prio-med",Faible:"prio-low"}[p]||"prio-low"}
function prioLabel(p){return{Haute:tr("prio_high"),Moyenne:tr("prio_med"),Faible:tr("prio_low")}[p]||p}

// ====== LOGS ======
async function addLog(action,ticketId,detail,staff){
  return gs({action:"addLog",staff:staff||adminPseudo,logAction:action,ticketId:ticketId,detail:detail||"",date:nowStr()});
}

async function loadLogs(){
  const el=document.getElementById("logs-list");
  el.innerHTML='<div class="loading">'+tr("loading")+'</div>';
  try{
    const r=await fetch(GS+"?action=getLogs");
    const data=await r.json();
    if(!Array.isArray(data)||!data.length){ el.innerHTML='<div class="empty">'+tr("no_log")+'</div>'; return; }
    const icons={reply:"💬",update:"🔄",assign:"👤",delete:"🗑️",add:"🎫"};
    el.innerHTML=data.slice().reverse().map(function(row){
      const date=row[0],staff=row[1],action=row[2],ticketId=row[3],detail=row[4]||"";
      return '<div class="log-entry">'
        +'<span class="log-icon">'+(icons[action]||"📋")+'</span>'
        +'<div class="log-content">'
        +'<div class="log-action">'+esc(TR[lang]["log_"+action]||action)+' &mdash; <span style="font-family:monospace;color:#58a6ff">'+esc(ticketId)+'</span></div>'
        +'<div class="log-meta">👤 '+esc(staff)+' · 📅 '+esc(date)+'</div>'
        +(detail?'<div class="log-detail">'+esc(detail)+'</div>':'')
        +'</div></div>';
    }).join("");
  }catch(e){
    console.error(e);
    el.innerHTML='<div class="empty">'+tr("log_error")+'</div>';
  }
}

function switchAdminTab(tab){
  document.getElementById("admin-tickets-section").style.display=tab==="tickets"?"block":"none";
  document.getElementById("admin-logs-section").style.display=tab==="logs"?"block":"none";
  document.getElementById("atab-tickets").style.cssText=tab==="tickets"?"background:#238636;border-color:#2ea043;color:#fff":"";
  document.getElementById("atab-logs").style.cssText=tab==="logs"?"background:#238636;border-color:#2ea043;color:#fff":"";
  if(tab==="logs") loadLogs();
}

// ====== TICKETS ======
async function loadTickets(){
  try{
    const r=await fetch(GS+"?action=get");
    const data=await r.json();
    if(!Array.isArray(data)) throw new Error("Réponse inattendue");
    tickets=data.filter(row=>row[0]).map(row=>({
      id:String(row[0]),date:formatDate(row[1]),name:row[2]||"",cat:row[3],
      subject:row[4],prio:row[5],msg:row[6],status:row[7]||"open",
      reply:row[8]||"",discord:row[9]||"",discordid:String(row[10]||""),
      assignee:row[11]||""
    })).reverse();
    renderList();
    if(isAdmin) renderAdminList();
  }catch(e){
    console.error(e);
    document.getElementById("ticket-list").innerHTML='<div class="empty">'+tr("no_ticket")+'</div>';
  }
}

function switchTab(t){
  ["tickets","new","suivre","admin"].forEach(k=>document.getElementById("tab-"+k).style.display=k===t?"block":"none");
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",["tickets","new","suivre","admin"][i]===t));
  if(t==="tickets") loadTickets();
}

function setFilter(f,el){filter=f;document.querySelectorAll("#tab-tickets .filter-btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");renderList();}
function setAdminFilter(f,el){adminFilter=f;document.querySelectorAll("#admin-tickets-section .filter-btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");renderAdminList();}

function ticketCard(t,sel,fn){
  return '<div class="ticket'+(sel===t.id?" selected":"")+'" data-id="'+esc(t.id)+'" onclick="'+fn+'(this.dataset.id)">'
    +'<div class="ticket-header"><span class="ticket-id">'+esc(t.id)+'</span><span class="pill '+esc(t.status)+'">'+esc(statusLabel(t.status))+'</span></div>'
    +'<div class="ticket-title">'+esc(t.subject)+'</div>'
    +'<div class="ticket-meta" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">@'+esc(t.discord)+' · '+esc(t.cat)+' · <span class="pill '+prioClass(t.prio)+'">'+esc(prioLabel(t.prio))+'</span>'
    +(t.assignee?'<span class="assigned">👤 '+esc(t.assignee)+'</span>':'')
    +'</div></div>';
}

function ticketDetailHTML(t){
  return '<div class="detail">'
    +'<div class="ticket-id" style="margin-bottom:6px">'+esc(t.id)+' · '+esc(t.date)+'</div>'
    +'<div class="detail-title">'+esc(t.subject)+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center">'
    +'<span class="pill '+esc(t.status)+'">'+esc(statusLabel(t.status))+'</span>'
    +'<span class="pill '+prioClass(t.prio)+'">'+esc(prioLabel(t.prio))+'</span>'
    +'<span style="font-size:12px;color:#8b949e">'+esc(t.cat)+'</span>'
    +(t.assignee?'<span class="assigned">👤 '+esc(t.assignee)+'</span>':'')
    +'</div>'
    +'<div style="font-size:12px;color:#5865f2;margin-bottom:8px">@'+esc(t.discord)+'</div>'
    +'<div class="detail-body">'+esc(t.msg)+'</div>'
    +(t.reply
      ?'<div class="reply-box"><div class="reply-label">'+tr("reply_team")+'</div><div class="reply-text">'+esc(t.reply)+'</div></div>'
      :'<div style="font-size:12px;color:#8b949e;margin-top:10px;font-style:italic">'+tr("waiting")+'</div>')
    +'</div>';
}

function renderList(){
  const list=tickets.filter(t=>filter==="all"||t.status===filter);
  document.getElementById("open-count").textContent=tickets.filter(t=>t.status==="open").length;
  const el=document.getElementById("ticket-list");
  if(!list.length){el.innerHTML='<div class="empty">'+tr("no_ticket")+'</div>';return;}
  el.innerHTML=list.map(t=>ticketCard(t,selectedId,"selectTicket")).join("");
}

function renderAdminList(){
  const list=tickets.filter(t=>adminFilter==="all"||t.status===adminFilter);
  const el=document.getElementById("admin-ticket-list");
  if(!list.length){el.innerHTML='<div class="empty">'+tr("no_ticket")+'</div>';return;}
  el.innerHTML=list.map(t=>ticketCard(t,adminSelectedId,"selectAdminTicket")).join("");
}

function selectTicket(id){
  const t=tickets.find(x=>x.id===id); if(!t) return;
  selectedId=id;renderList();
  document.getElementById("ticket-detail").innerHTML=ticketDetailHTML(t);
}

function selectAdminTicket(id){
  const t=tickets.find(x=>x.id===id); if(!t) return;
  adminSelectedId=id;
  renderAdminList();
  document.getElementById("admin-ticket-detail").innerHTML='<div class="detail">'
    +'<div class="ticket-id" style="margin-bottom:6px">'+esc(t.id)+' · '+esc(t.date)+'</div>'
    +'<div class="detail-title">'+esc(t.subject)+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center">'
    +'<span class="pill '+esc(t.status)+'">'+esc(statusLabel(t.status))+'</span>'
    +'<span class="pill '+prioClass(t.prio)+'">'+esc(prioLabel(t.prio))+'</span>'
    +'<span style="font-size:12px;color:#8b949e">'+esc(t.cat)+'</span>'
    +(t.assignee?'<span class="assigned">👤 '+esc(t.assignee)+'</span>':'')
    +'</div>'
    +'<div style="font-size:12px;color:#5865f2;margin-bottom:4px">@'+esc(t.discord)+'</div>'
    +(t.discordid?'<div style="font-size:11px;color:#8b949e;margin-bottom:8px;font-family:monospace">ID: '+esc(t.discordid)+'</div>':'')
    +'<div class="detail-body">'+esc(t.msg)+'</div>'
    +(t.reply?'<div class="reply-box"><div class="reply-label">'+tr("reply_current")+'</div><div class="reply-text">'+esc(t.reply)+'</div></div>':'')
    +'<div class="reply-input-box">'
    +'<label>'+tr("lbl_assignee")+'</label>'
    +'<input id="admin-assignee" type="text" value="'+esc(t.assignee||adminPseudo)+'" placeholder="'+esc(tr("ph_assignee"))+'" style="margin-bottom:8px">'
    +'<label>'+tr("lbl_status")+'</label>'
    +'<select id="admin-status-sel" style="margin-bottom:8px">'
    +'<option value="open"'+(t.status==="open"?" selected":"")+'>'+tr("opt_open")+'</option>'
    +'<option value="in_progress"'+(t.status==="in_progress"?" selected":"")+'>'+tr("opt_progress")+'</option>'
    +'<option value="closed"'+(t.status==="closed"?" selected":"")+'>'+tr("opt_closed")+'</option>'
    +'</select>'
    +'<label>'+tr("lbl_reply")+'</label>'
    +'<textarea id="admin-reply-txt" placeholder="'+esc(tr("ph_reply"))+'">'+esc(t.reply)+'</textarea>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">'
    +'<button class="btn sm primary" data-id="'+esc(t.id)+'" onclick="saveReply(this.dataset.id)">'+tr("save")+'</button>'
    +'<button class="btn sm danger" data-id="'+esc(t.id)+'" onclick="deleteTicket(this.dataset.id)">'+tr("del")+'</button>'
    +'</div></div></div>';
}

async function saveReply(id){
  const t=tickets.find(x=>x.id===id); if(!t) return;
  const newReply=document.getElementById("admin-reply-txt").value;
  const newStatus=document.getElementById("admin-status-sel").value;
  const newAssignee=document.getElementById("admin-assignee").value.trim();

  // On garde les anciennes valeurs AVANT de les écraser (corrige le bug du log d'assignation)
  const oldReply=t.reply, oldStatus=t.status, oldAssignee=t.assignee;
  t.reply=newReply; t.status=newStatus; t.assignee=newAssignee;

  // Mise à jour de l'affichage tout de suite
  renderAdminList(); renderList(); selectAdminTicket(id);

  // Écritures dans Google Sheets (l'une après l'autre pour éviter les conflits)
  await gs({action:"reply",id:id,reply:newReply});
  await gs({action:"update",id:id,status:newStatus});
  await gs({action:"assign",id:id,assignee:newAssignee});

  // Notifications Discord (seulement si quelque chose a changé)
  if(newReply && newReply!==oldReply) notifyReply(t,newReply);
  if(newStatus!==oldStatus) notifyStatus(t,oldStatus,newStatus);

  // Logs
  if(newReply!==oldReply) await addLog("reply",id,"Réponse: "+newReply.slice(0,60)+(newReply.length>60?"...":""));
  if(newStatus!==oldStatus) await addLog("update",id,TR.fr["status_"+oldStatus]+" → "+TR.fr["status_"+newStatus]);
  if(newAssignee!==oldAssignee) await addLog("assign",id,"Assigné à: "+(newAssignee||"—"));
}

async function postWebhook(url,payload){
  try{
    await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }catch(e){ console.error("Webhook error",e); }
}

async function notifyReply(t,reply){
  const mention=t.discordid?"<@"+t.discordid+">":"@"+t.discord;
  await postWebhook(WH_REPLY,{
    content:mention+" — 💬 L'équipe a répondu à ton ticket !",
    embeds:[{
      title:"💬 Réponse à ton ticket — "+t.id,
      color:3447003,
      fields:[
        {name:"Sujet",value:cut(t.subject,1000)||"—"},
        {name:"Réponse de l'équipe",value:cut(reply,1000)},
        {name:"Statut",value:statusIcon(t.status)+" "+TR.fr["status_"+t.status],inline:true},
        {name:"Pris en charge par",value:"👤 "+(t.assignee||"Équipe NoxStudio"),inline:true}
      ],
      footer:{text:"Support NoxStudio — onglet 🔍 Suivre mon ticket avec l'ID "+t.id}
    }]
  });
}

async function notifyStatus(t,oldStatus,newStatus){
  const mention=t.discordid?"<@"+t.discordid+">":"@"+t.discord;
  const colors={open:3447003,in_progress:16776960,closed:3066993};
  await postWebhook(WH_REPLY,{
    content:mention+" — 🔔 Le statut de ton ticket a changé !",
    embeds:[{
      title:"🔔 Mise à jour du ticket — "+t.id,
      color:colors[newStatus]||3447003,
      fields:[
        {name:"Sujet",value:cut(t.subject,1000)||"—"},
        {name:"Ancien statut",value:statusIcon(oldStatus)+" "+TR.fr["status_"+oldStatus],inline:true},
        {name:"Nouveau statut",value:statusIcon(newStatus)+" "+TR.fr["status_"+newStatus],inline:true},
        {name:"Pris en charge par",value:"👤 "+(t.assignee||"Équipe NoxStudio"),inline:true}
      ],
      footer:{text:"Support NoxStudio — onglet 🔍 Suivre mon ticket avec l'ID "+t.id}
    }]
  });
}

async function deleteTicket(id){
  if(!confirm(tr("confirm_delete"))) return;
  const td=tickets.find(x=>x.id===id);
  tickets=tickets.filter(x=>x.id!==id);
  adminSelectedId=null;selectedId=null;
  document.getElementById("admin-ticket-detail").innerHTML='<div class="empty">'+tr("select_ticket")+'</div>';
  document.getElementById("ticket-detail").innerHTML='<div class="empty">'+tr("select_ticket")+'</div>';
  renderAdminList();renderList();
  await addLog("delete",id,td?"Sujet: "+td.subject.slice(0,50):"");
  await gs({action:"delete",id:id});
}

function searchTicket(){
  const sid=document.getElementById("search-id").value.trim().toUpperCase();
  const t=tickets.find(x=>x.id.toUpperCase()===sid);
  const el=document.getElementById("search-result");
  if(!t){el.innerHTML='<div style="color:#f85149;font-size:14px;margin-top:10px">'+tr("not_found")+'</div>';return;}
  el.innerHTML=ticketDetailHTML(t);
}

// ====== ADMIN ======
function checkAdmin(){
  const pwd=document.getElementById("admin-pwd").value;
  const name=document.getElementById("admin-name").value.trim();
  if(pwd===ADMIN_PASSWORD&&name){
    isAdmin=true;adminPseudo=name;
    document.getElementById("admin-login").style.display="none";
    document.getElementById("admin-panel").style.display="block";
    document.getElementById("pwd-error").style.display="none";
    document.getElementById("admin-name-display").textContent=name;
    loadTickets();
  }else{document.getElementById("pwd-error").style.display="block";}
}

function logoutAdmin(){
  isAdmin=false;adminPseudo="";adminSelectedId=null;
  document.getElementById("admin-login").style.display="block";
  document.getElementById("admin-panel").style.display="none";
  document.getElementById("admin-pwd").value="";
  document.getElementById("admin-name").value="";
}

// ====== CRÉATION D'UN TICKET ======
async function createTicket(){
  const discord=document.getElementById("t-discord").value.trim();
  const discordid=document.getElementById("t-discordid").value.trim();
  const subject=document.getElementById("t-subject").value.trim();
  const msg=document.getElementById("t-msg").value.trim();
  const cat=document.getElementById("t-cat").value;
  const prio=document.getElementById("t-prio").value;
  const err=document.getElementById("form-error");
  if(!discord||!discordid||!subject||!msg){err.style.display="block";return;}
  err.style.display="none";
  const id="TKT-"+String(Date.now()).slice(-6);
  const now=nowStr();
  const t={id,name:"",discord,discordid,cat,subject,msg,prio,status:"open",date:now,reply:"",assignee:""};
  tickets.unshift(t);renderList();

  document.getElementById("t-discord").value="";
  document.getElementById("t-discordid").value="";
  document.getElementById("t-subject").value="";
  document.getElementById("t-msg").value="";
  switchTab("tickets");
  const n=document.getElementById("notif-created");
  n.innerHTML=tr("created").replace("{id}",esc(id));
  n.classList.add("show");
  setTimeout(()=>n.classList.remove("show"),10000);

  // Envoi en arrière-plan : Sheets d'abord, puis log, puis Discord
  await saveToSheets(t);
  await addLog("add",id,"Sujet: "+subject.slice(0,60)+" · Par: "+discord,discord);
  sendToDiscord(t);
}

async function saveToSheets(t){
  return gs({action:"add",id:t.id,date:t.date,name:"",cat:t.cat,subject:t.subject,prio:t.prio,msg:t.msg,status:"open",discord:t.discord,discordid:t.discordid,assignee:""});
}

async function sendToDiscord(t){
  const colors={Haute:15158332,Moyenne:16776960,Faible:3447003};
  await postWebhook(WH,{
    content:"<@&1496526102544515159> — 🎫 Nouveau ticket à traiter !",
    embeds:[{
      title:"🎫 Nouveau ticket — "+t.id,
      color:colors[t.prio]||3447003,
      fields:[
        {name:"Sujet",value:cut(t.subject,1000)},
        {name:"Discord",value:cut("@"+t.discord+" ("+t.discordid+")",1000),inline:true},
        {name:"Catégorie",value:t.cat,inline:true},
        {name:"Priorité",value:t.prio,inline:true},
        {name:"Message",value:cut(t.msg,1000)}
      ],
      footer:{text:"Ticket Support NoxStudio · "+t.date}
    }]
  });
}

// ====== DÉMARRAGE ======
document.getElementById("admin-pwd").addEventListener("keydown",e=>{if(e.key==="Enter")checkAdmin();});
document.getElementById("search-id").addEventListener("keydown",e=>{if(e.key==="Enter")searchTicket();});
applyLang();
loadTickets();
</script>
